name: pages
on:
  push:
    branches: [main]
    paths: [site/**, tools/build-site.py, forge/core.py]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.dep.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 -I tools/build-site.py "https://github.com/${{ github.repository }}" "https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/"
      - run: mkdir out && cp site/index.html out/index.html && cp site/og.png out/og.png
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out
      - id: dep
        uses: actions/deploy-pages@v4

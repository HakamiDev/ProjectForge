name: release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 -I tests/testforge.py
      - run: python3 -I tools/build-single.py
      - run: |
          mkdir -p "dist/Project Forge"
          cp "dist/Project Forge 1.py" "dist/Project Forge/"
          cd dist && zip -qr "Project Forge.zip" "Project Forge"
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/Project Forge 1.py
            dist/Project Forge.zip
          generate_release_notes: true

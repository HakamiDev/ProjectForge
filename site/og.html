<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=1200">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@400;600&display=swap">
<style>
html,body{margin:0;width:1200px;height:630px;overflow:hidden}body{background:linear-gradient(150deg,#0E1220,#15191E 55%,#1B1540);color:#EEF2FB;font-family:"Readex Pro",sans-serif;position:relative;overflow:hidden}
.dots{position:absolute;inset:0;background-image:radial-gradient(rgba(255,255,255,.14) 1.2px,transparent 1.3px);background-size:34px 34px;opacity:.5}
.glow{position:absolute;width:700px;height:700px;border-radius:50%;filter:blur(120px);opacity:.45}
.g1{background:#34F5A0;right:-200px;top:-300px}.g2{background:#7B4DFF;left:-250px;bottom:-350px}
.box{position:absolute;inset:48px;border-radius:40px;border:1px solid rgba(255,255,255,.14);background:rgba(255,255,255,.04);padding:64px 72px;box-sizing:border-box}
.brand{display:flex;align-items:center;gap:14px;font-size:30px;font-weight:600}
.brand i{width:38px;height:38px;border-radius:11px;background:conic-gradient(from 200deg,#34F5A0,#3EC7FF,#7B4DFF,#34F5A0)}
h1{font-size:72px;line-height:1.25;margin:36px 0 18px;font-weight:600}
h1 em{font-style:normal;background:linear-gradient(90deg,#34F5A0,#3EC7FF,#B98CFF);-webkit-background-clip:text;color:transparent}
p{font-size:28px;color:#B9C3DB;margin:0;line-height:1.6}
.pills{position:absolute;bottom:60px;right:72px;display:flex;gap:12px}
.pills span{padding:10px 22px;border-radius:999px;border:1px solid rgba(255,255,255,.2);font-size:22px;background:rgba(255,255,255,.06)}
</style></head><body><div class="dots"></div><div class="glow g1"></div><div class="glow g2"></div>
<div class="box"><div class="brand"><i></i>Project Forge</div>
<h1>نظام تشغيل لفريق <em>وكلاء</em> الذكاء الاصطناعي</h1>
<p>لوحة واحدة · بوابة جودة مستقلة · حوكمة قرارات · مؤشرات أداء</p>
<div class="pills"><span>مفتوح المصدر</span><span>بلا خادم</span><span>أمر واحد</span></div></div></body></html>

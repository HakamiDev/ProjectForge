.grid{display:grid;gap:12px}.g4{grid-template-columns:repeat(auto-fit,minmax(min(100%,200px),1fr))}.g6{grid-template-columns:repeat(auto-fit,minmax(min(100%,150px),1fr))}.g3{grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr))}.g2{grid-template-columns:repeat(auto-fit,minmax(min(100%,380px),1fr))}

/* ===== النسخة الجديدة: موقع مكتب الإدارة الجديد (تسعة أقسام) ===== */
:root{--link:#2F6BE0;--sel:rgba(47,107,224,.14)}

html{scroll-padding-top:90px}
body{padding-block:0 110px}
/* الأزرار: تدور اللمعة عند الضغط والتحويم والحالي فقط، وتبقى الحلقة ثابتة في غيرها */
.sb{animation:none;--ang:35deg}
.sb:hover,.sb:focus-visible,.sb[aria-current="page"],.sb.p,.sb[aria-pressed="true"]{animation:rot var(--sbspd,2.8s) linear infinite}

button{cursor:pointer}
a{color:var(--link)}
/* الرأس والتنقل */
header.top{margin-top:max(10px,env(safe-area-inset-top,0px))}
.hd{padding:9px 14px;border-radius:999px}
.brand{white-space:nowrap}

}

/* ===== مكتبة الزجاج المضمّنة (تحت .xlib) ===== */
/* زر الزجاج: زر زجاجي بانكسار الحافة للمكتب (الواجهة فقط).
   المصدر الفكري: آلية «عدسة الحافة» العامة (خريطة إزاحة في مرشح SVG داخل backdrop-filter)؛ الكود كله مكتوب للمكتب.
   الرموز من رموز الهوية، والحركة من أوضاع الحركة (أوضاع data-motion).
   قاعدة الأداء: الحركة transform وopacity فقط؛ لا تحريك box-shadow ولا blur ولا background. */

.gb{
  --gb-h:72px; --gb-fs:20px; --gb-blur:2.5px;
  --gx:0; --gy:0; --gs:1; --gh:0; --gl:0;           /* يكتبها سكربت زر الزجاج أثناء التفاعل فقط */
  position:relative; display:inline-flex; align-items:stretch; justify-content:center;
  min-width:48px; min-height:48px; height:var(--gb-h); max-width:100%;
  padding:0; border:0; border-radius:var(--radius-pill); background:none;
  color:#F7F4FF;                                     /* ink الداكن: الزجاج داكن في الوضعين */
  font:700 var(--gb-fs)/1.25 var(--font-ui); letter-spacing:0; text-decoration:none;
  cursor:pointer; user-select:none; -webkit-tap-highlight-color:transparent; touch-action:manipulation;
}
.gb,.gb *{box-sizing:border-box}
.gb:focus-visible{outline:2px solid var(--cyan); outline-offset:5px}

/* ظل ثابت بطبقتين؛ يتبدّل ظهور الثانية بالشفافية وحدها */

  box-shadow:0 10px 24px -10px rgba(6,8,23,.55),0 2px 4px rgba(6,8,23,.25); transition:opacity var(--motion-fast) var(--motion-ease)}

.gb[data-pressed] .gb-shadow{opacity:.65}

.gb-face{
  position:relative; display:flex; align-items:center; justify-content:center; gap:var(--space-3);
  width:100%; padding:0 var(--space-6); border-radius:inherit;
}
/* لا transform في السكون (لا طبقة مركّبة دائمة)؛ يُفعَّل أثناء التفاعل فقط */
.gb[data-live] .gb-face{

  /* حواف أخف لتظهر العدسة، ووسط أثقل لتباين النص 4.5:1 (قيمة surface من الرموز؛ الوسط .68 يعطي 4.5:1 فأكثر فوق الأبيض) */

    linear-gradient(90deg,rgba(35,30,59,.30),rgba(35,30,59,.68) 24px,rgba(35,30,59,.68) calc(100% - 24px),rgba(35,30,59,.30));

  -webkit-backdrop-filter:blur(var(--gb-blur)) saturate(1.15); backdrop-filter:blur(var(--gb-blur)) saturate(1.15);
}

  background:linear-gradient(112deg,transparent 38%,rgba(247,244,255,.16) 47%,rgba(247,244,255,.30) 50%,transparent 60%);
  transform:translate3d(calc(var(--gx) * 16%),0,0); opacity:calc(var(--gl) * .9)}

  background:conic-gradient(from 200deg,rgba(247,244,255,.85),rgba(247,244,255,.14) 26%,rgba(247,244,255,.04) 50%,rgba(197,181,242,.34) 72%,rgba(247,244,255,.85));
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0); -webkit-mask-composite:xor;
  mask:linear-gradient(#000 0 0) content-box exclude,linear-gradient(#000 0 0)}

/* مكوّنات الزجاج الأولى: سبعة مكوّنات مساندة للمكتب.
   الرموز: رموز الهوية · الحركة: أوضاع الحركة (data-motion). القاعدة: transform وopacity وclip-path فقط، بلا WebGL، بلا مكتبات.

/* ===== 1. زر التوهّج السفلي ===== */
.gfb{position:relative; isolation:isolate; display:inline-flex; align-items:center; justify-content:center; gap:var(--space-2); min-height:48px; padding:0 var(--space-5);
  border:0; border-radius:var(--radius-pill); overflow:hidden; text-decoration:none; cursor:pointer; background:var(--glass-sheen),linear-gradient(0deg,rgba(35,30,59,.78),rgba(35,30,59,.78));

.gfb svg{width:20px; height:20px; fill:none; stroke:currentColor; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round}

/* ===== 2. شارة الحالة (مرجع Activity Badge): نقطة بنبضة حلقة ===== */
.ab{display:inline-flex; align-items:center; gap:var(--space-2); font-weight:600; font-size:14px}
.ab-dot{position:relative; width:12px; height:12px; border-radius:50%; background:var(--ab-c,#187E62)}
.ab-dot::after{content:""; position:absolute; inset:0; border-radius:50%; background:var(--ab-c,#187E62); opacity:0; animation:ab-pulse 1800ms var(--motion-ease) infinite}
.ab[data-state="ok"]{--ab-c:#34C79A} .ab[data-state="warn"]{--ab-c:#7FA8FF} .ab[data-state="bad"]{--ab-c:#F0607F}
.ab[data-paused] .ab-dot::after{animation-play-state:paused}
@keyframes ab-pulse{0%{opacity:.7; transform:scale(1)}70%,100%{opacity:0; transform:scale(2.6)}}

/* ===== 3. حلقة الأيقونة (مرجع Icon WebGL Shader): تدرج مخروطي يدور بـtransform بدل WebGL ===== */
.ir{position:relative; display:inline-grid; place-items:center; width:var(--ir-size,88px); height:var(--ir-size,88px); border-radius:50%; color:var(--gx-ink)}
.ir-ring{position:absolute; inset:0; border-radius:50%; overflow:hidden; animation:ir-spin 9s linear infinite}
.ir-ring::before{content:""; position:absolute; inset:-50%; background:conic-gradient(from 0deg,rgba(247,244,255,.9),var(--lilac) 18%,rgba(35,30,59,.2) 40%,var(--rose) 62%,rgba(247,244,255,.9) 82%,var(--cyan) 94%,rgba(247,244,255,.9))}
.ir-body{position:absolute; inset:3px; border-radius:50%; background:linear-gradient(180deg,#2C2650,#0B1030); box-shadow:inset 0 1px 4px rgba(247,244,255,.12),inset 0 -6px 12px rgba(0,0,0,.55)}
.ir svg{position:relative; width:36%; height:36%; fill:none; stroke:currentColor; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round}
.ir[data-paused] .ir-ring{animation-play-state:paused}
@keyframes ir-spin{to{transform:rotate(360deg)}}

/* ===== 4. تأكيد الحذف (مرجع Delete Interaction): ثلاث حالات، عدّ تنازلي 5 ثوانٍ للتراجع ===== */
.di{position:relative; isolation:isolate; display:inline-flex; align-items:center; justify-content:center; gap:var(--space-3); min-width:176px; min-height:52px; padding:0 var(--space-5);
  border:0; border-radius:var(--radius-pill); overflow:hidden; cursor:pointer; background:rgba(194,65,95,.92); color:#fff; box-shadow:0 8px 18px -10px rgba(6,8,23,.6); touch-action:manipulation}
.di-bar{position:absolute; inset:0; z-index:-1; background:rgba(0,0,0,.28); transform-origin:100% 50%; transform:scaleX(0)}
[dir="ltr"] .di-bar{transform-origin:0 50%}
.di[data-state="timer"]{background:#3A3158; color:var(--gx-ink)}
.di[data-state="timer"] .di-bar{background:rgba(247,244,255,.14); transform:scaleX(1); animation:di-count var(--di-s,5s) linear forwards}
.di[data-state="done"]{background:#1E5C4C; cursor:default}
.di-n{display:none; min-width:1.2em; text-align:center; font-variant-numeric:tabular-nums}
.di[data-state="timer"] .di-n{display:inline}
.di:active:not([data-state="done"]){transform:scale(.96)}
@keyframes di-count{from{transform:scaleX(1)}to{transform:scaleX(0)}}

/* ===== 5. زر الدائرة والسهم (مرجع Arrow Fill Button): تتسع الدائرة فتكشف طبقة النص المعكوس بـclip-path ===== */
.afb{--afb-bg:#354BD4; --afb-fill:#F7F4FF; --afb-fill-ink:#231E3B; --afb-c:38px; --afb-pad:6px;
  position:relative; display:inline-flex; align-items:center; height:50px; padding-inline:var(--space-5) calc(var(--afb-c) + var(--afb-pad) + var(--space-4)); border-radius:var(--radius-pill);
  background:var(--afb-bg); color:#fff; text-decoration:none; overflow:hidden; white-space:nowrap; cursor:pointer; touch-action:manipulation}
.afb-cover{position:absolute; inset:0; display:flex; align-items:center; padding-inline:var(--space-5) calc(var(--afb-c) + var(--afb-pad) + var(--space-4)); background:var(--afb-fill); color:var(--afb-fill-ink); pointer-events:none;
  clip-path:circle(calc(var(--afb-c) / 2) at calc(100% - var(--afb-pad) - var(--afb-c) / 2) 50%); transition:clip-path 450ms var(--motion-ease)}
[dir="rtl"] .afb-cover{clip-path:circle(calc(var(--afb-c) / 2) at calc(var(--afb-pad) + var(--afb-c) / 2) 50%)}
.afb:hover .afb-cover,.afb:focus-visible .afb-cover{clip-path:circle(150% at 50% 50%)}
.afb-ic{position:absolute; inset-inline-end:var(--afb-pad); top:50%; width:var(--afb-c); height:var(--afb-c); margin-top:calc(var(--afb-c) / -2); display:grid; place-items:center; color:var(--afb-fill-ink); pointer-events:none}
.afb-ic svg{width:20px; height:20px; fill:none; stroke:currentColor; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round; transition:transform 450ms var(--motion-ease)}
[dir="rtl"] .afb-ic svg{transform:scaleX(-1)}
.afb:hover .afb-ic svg{transform:translateX(3px)} [dir="rtl"] .afb:hover .afb-ic svg{transform:scaleX(-1) translateX(3px)}

/* ===== 6. زر النجوم (مرجع Premium Shader Button): نجوم بالشفافية وحدها بدل WebGL ===== */
.gst{position:relative; isolation:isolate; display:inline-flex; align-items:center; justify-content:center; min-height:56px; padding:0 var(--space-7); border:0; border-radius:var(--radius-pill); overflow:hidden; cursor:pointer;
  background:radial-gradient(120% 160% at 85% 0%,rgba(197,181,242,.38),transparent 55%),#0B1030; box-shadow:inset 0 0 0 1px rgba(247,244,255,.18),0 10px 26px -12px rgba(0,0,0,.6); touch-action:manipulation}
.gst-s{position:absolute; z-index:-1; width:3px; height:3px; border-radius:50%; background:#fff; opacity:0; inset-inline-start:var(--x); top:var(--y)}
.gst:hover .gst-s,.gst:focus-visible .gst-s{animation:gst-tw 1400ms ease-in-out var(--d) infinite}
.gst:active{transform:scale(.97)}
@keyframes gst-tw{0%,100%{opacity:.05}50%{opacity:.95}}

/* ===== أثر المؤشر ===== */
.mx-trail{position:fixed; inset:0; width:100vw; height:100vh; pointer-events:none; z-index:50}

/* ===== الأوضاع وبدائلها ===== */
html[data-motion="simple"] .ab-dot::after,html[data-motion="static"] .ab-dot::after,
html[data-motion="simple"] .ir-ring,html[data-motion="static"] .ir-ring,
html[data-motion="simple"] .gst-s,html[data-motion="static"] .gst-s{animation:none!important}
html[data-motion="static"] .gfb::before,html[data-motion="static"] .afb-cover,html[data-motion="static"] .afb-ic svg{transition:none!important}
html[data-motion="static"] .di[data-state="timer"] .di-bar{animation:none; transform:scaleX(1)}
html[data-motion="simple"] .gfb::before{transition:opacity 200ms linear}
@media(prefers-reduced-motion:reduce) and (min-width:901px){.ab-dot::after,.ir-ring,.gst-s{animation:none!important}.gfb::before,.afb-cover,.afb-ic svg{transition:none!important}.di[data-state="timer"] .di-bar{animation:none; transform:scaleX(1)}}
@media(prefers-reduced-transparency:reduce){.gfb{background:#231E3B}}
@media(forced-colors:active){.gfb,.gst,.di,.afb{border:1px solid ButtonText; background:ButtonFace; color:ButtonText; box-shadow:none}.afb-cover{display:none}.ab-dot{background:CanvasText}.ir-ring{display:none}.ir{border:2px solid CanvasText}}
/* مكوّنات الزجاج الثانية: أربعة مكوّنات أزرار للمكتب.
   الرموز: رموز الهوية · الحركة: أوضاع الحركة (data-motion). القاعدة: transform وopacity وclip-path وrotate فقط، بلا WebGL، بلا مكتبات.
   المكوّنات: .ngb زر نوفا المتوهّج · .shb زر الشيدر مع طبقة .lqg (التدرج السائل) · .cta زر الدعوة إلى إجراء · .tt مبدّل المظهر */

.ngb,.shb,.cta,.tt{box-sizing:border-box; font:600 16px/1.5 var(--font-ui); letter-spacing:0}
.ngb *,.shb *,.cta *,.tt *{box-sizing:border-box}
:is(.ngb,.shb,.cta,.tt):focus-visible{outline:2px solid var(--cyan); outline-offset:4px}
.xlib[data-xt="light"] :is(.ngb,.shb,.cta,.tt):focus-visible{outline-color:var(--blue)}

/* ===== 1. زر نوفا المتوهّج .ngb (مرجع Nova Glow Button): حلقة مخروطية تدور بالدوران لا بتغيير زاوية التدرج ===== */
.ngb{--ngb-bg:#0B1030; --ngb-ink:#F7F4FF; --ngb-a:var(--lilac); --ngb-b:var(--cyan); --ngb-c:var(--blue); --ngb-dur:10s;
  position:relative; isolation:isolate; display:inline-flex; align-items:center; justify-content:center; min-height:52px; min-width:136px; padding:0 var(--space-6);
  border:0; border-radius:var(--radius-pill); overflow:hidden; cursor:pointer; text-decoration:none; white-space:nowrap; background:var(--ngb-bg); color:var(--ngb-ink);
  box-shadow:inset 0 0 0 1px rgba(247,244,255,.14),inset 0 1px 0 rgba(255,255,255,.12),0 8px 22px -12px rgba(53,75,212,.7);
  transition:transform 220ms var(--motion-ease); touch-action:manipulation; -webkit-tap-highlight-color:transparent}
.xlib[data-xt="light"] .ngb{--ngb-bg:#FFFFFF; --ngb-ink:#231E3B; --ngb-a:var(--blue); --ngb-b:#1E3B82; --ngb-c:#6C83CD; box-shadow:inset 0 0 0 1px rgba(35,30,59,.14),0 8px 22px -12px rgba(53,75,212,.45)}
.ngb:hover,.ngb:focus-visible{transform:translateY(-1px) scale(1.02)}
.ngb:active{transform:scale(.98)}
.ngb-ring{position:absolute; inset:0; z-index:1; border-radius:inherit; padding:2px; overflow:hidden; pointer-events:none; opacity:.9; transition:opacity 220ms linear;
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0); -webkit-mask-composite:xor; mask:linear-gradient(#000 0 0) content-box exclude,linear-gradient(#000 0 0)}
.ngb-spin{position:absolute; left:50%; top:50%; width:260%; aspect-ratio:1; translate:-50% -50%; animation:ngb-spin var(--ngb-dur) linear infinite;
  background:conic-gradient(var(--ngb-c) 0deg,var(--ngb-a) 70deg,var(--ngb-b) 135deg,transparent 190deg,var(--ngb-c) 260deg,var(--ngb-a) 360deg)}
.ngb-halo{position:absolute; inset:0; z-index:0; border-radius:inherit; overflow:hidden; pointer-events:none; opacity:.30; transition:opacity 220ms linear}
.ngb-halo .ngb-spin{filter:blur(14px); opacity:.85; animation-duration:calc(var(--ngb-dur) * 1.4); animation-direction:reverse}
.ngb:hover .ngb-ring,.ngb:focus-visible .ngb-ring{opacity:1}
.ngb:hover .ngb-halo,.ngb:focus-visible .ngb-halo{opacity:.65}
.ngb-shine{position:absolute; inset:2px; z-index:2; border-radius:inherit; pointer-events:none; opacity:.45; transform:translateX(-38%);
  background:linear-gradient(110deg,transparent,rgba(255,255,255,.04) 35%,rgba(255,255,255,.16) 50%,rgba(255,255,255,.04) 65%,transparent);
  transition:transform 650ms var(--motion-ease),opacity 220ms linear}
[dir="rtl"] .ngb-shine{transform:translateX(38%)}
.ngb:hover .ngb-shine,.ngb:focus-visible .ngb-shine{opacity:1; transform:translateX(38%)}
[dir="rtl"] .ngb:hover .ngb-shine,[dir="rtl"] .ngb:focus-visible .ngb-shine{transform:translateX(-38%)}
.ngb-label{position:relative; z-index:3}
.ngb[data-paused] .ngb-spin{animation-play-state:paused}
@keyframes ngb-spin{to{rotate:360deg}}

/* ===== 2. طبقة التدرج السائل .lqg (مرجع Liquid Gradient): بقع لونية كبيرة تنجرف بالإزاحة والدوران وحدهما، بدل شيدر WebGL ===== */
.lqg{--lqg-1:#0B1030; --lqg-2:#1E3B82; --lqg-3:#354BD4; --lqg-4:#6C83CD; --lqg-5:#F2BDD1; --lqg-dur:16s;
  position:absolute; inset:0; z-index:0; overflow:hidden; pointer-events:none; background:var(--lqg-1); border-radius:inherit}
.lqg::before,.lqg::after{content:""; position:absolute; left:50%; top:50%; width:180%; aspect-ratio:1.6; translate:-50% -50%; border-radius:50%}
.lqg::before{background:
  radial-gradient(38% 45% at 28% 36%,var(--lqg-3),transparent 70%),
  radial-gradient(34% 40% at 72% 64%,var(--lqg-2),transparent 70%),
  radial-gradient(18% 26% at 56% 30%,var(--lqg-4),transparent 72%);
  animation:lqg-a var(--lqg-dur) ease-in-out infinite alternate}
.lqg::after{background:
  radial-gradient(30% 38% at 66% 38%,var(--lqg-3),transparent 70%),
  radial-gradient(14% 20% at 36% 70%,var(--lqg-5),transparent 72%),
  radial-gradient(34% 40% at 22% 62%,var(--lqg-2),transparent 70%);
  opacity:.8; animation:lqg-b calc(var(--lqg-dur) * 1.35) ease-in-out infinite alternate}
@keyframes lqg-a{from{transform:translate(-9%,-4%) rotate(-8deg) scale(1)}to{transform:translate(9%,5%) rotate(10deg) scale(1.12)}}
@keyframes lqg-b{from{transform:translate(8%,5%) rotate(12deg) scale(1.1)}to{transform:translate(-8%,-6%) rotate(-10deg) scale(.96)}}
.lqg[data-paused]::before,.lqg[data-paused]::after{animation-play-state:paused}

/* ===== 3. زر الشيدر .shb (مرجع Shader Button): طبقة .lqg خلف النص وسهم ينزلق عند المرور ===== */
.shb{--shb-ink:#FFFFFF;
  position:relative; isolation:isolate; display:inline-flex; align-items:center; justify-content:center; gap:var(--space-3); min-height:56px; padding:0 var(--space-7);
  border:0; border-radius:var(--radius-pill); overflow:hidden; cursor:pointer; text-decoration:none; white-space:nowrap; color:var(--shb-ink); font:600 18px/1.4 var(--font-ui);
  box-shadow:inset 0 0 0 2px rgba(255,255,255,.24),0 12px 28px -14px rgba(11,16,48,.8); transition:transform 240ms var(--motion-ease); touch-action:manipulation; -webkit-tap-highlight-color:transparent}
.shb::after{content:""; position:absolute; inset:0; z-index:1; border-radius:inherit; pointer-events:none;
  background:radial-gradient(70% 140% at 50% 50%,rgba(11,16,48,.5),rgba(11,16,48,.22) 70%,rgba(11,16,48,0))}   /* يضمن تباين النص ≥ 4.5 فوق أفتح بقعة */
.shb .lqg{transition:opacity 400ms var(--motion-ease)}
.shb:hover .lqg,.shb:focus-visible .lqg{opacity:.7}
.shb:active{transform:scale(.97)}
.shb-label,.shb-ic{position:relative; z-index:2}
.shb-ic{display:inline-grid; width:22px; height:22px; place-items:center; transition:transform 300ms var(--motion-ease)}
.shb-ic svg{width:100%; height:100%; fill:none; stroke:currentColor; stroke-width:1.9; stroke-linecap:round; stroke-linejoin:round}
[dir="rtl"] .shb-ic svg{transform:scaleX(-1)}
.shb:hover .shb-ic,.shb:focus-visible .shb-ic{transform:translateX(4px)}
[dir="rtl"] .shb:hover .shb-ic,[dir="rtl"] .shb:focus-visible .shb-ic{transform:translateX(-4px)}

/* ===== 4. زر الدعوة إلى إجراء .cta (مرجع CTA Action Button): تتسع الدائرة السوداء بـclip-path بدل تمديد العرض ===== */
.cta{--cta-bg:#F7F4FF; --cta-ink:#231E3B; --cta-fill:#231E3B; --cta-fill-ink:#FFFFFF; --cta-c:40px; --cta-pad:6px;
  position:relative; display:inline-flex; align-items:center; height:52px; padding-inline:var(--space-5) calc(var(--cta-c) + var(--cta-pad) + var(--space-4)); border-radius:var(--radius-pill);
  background:var(--cta-bg); color:var(--cta-ink); text-decoration:none; overflow:hidden; white-space:nowrap; cursor:pointer; font:600 17px/1.4 var(--font-ui);
  box-shadow:inset 0 0 0 1px rgba(35,30,59,.12),0 10px 24px -14px rgba(6,8,23,.7); touch-action:manipulation; -webkit-tap-highlight-color:transparent}
.cta-cover{position:absolute; inset:0; display:flex; align-items:center; padding-inline:var(--space-5) calc(var(--cta-c) + var(--cta-pad) + var(--space-4)); background:var(--cta-fill); color:var(--cta-fill-ink); pointer-events:none;
  clip-path:circle(calc(var(--cta-c) / 2) at calc(100% - var(--cta-pad) - var(--cta-c) / 2) 50%); transition:clip-path 500ms var(--motion-ease)}
[dir="rtl"] .cta-cover{clip-path:circle(calc(var(--cta-c) / 2) at calc(var(--cta-pad) + var(--cta-c) / 2) 50%)}
.cta:hover .cta-cover,.cta:focus-visible .cta-cover{clip-path:circle(150% at 50% 50%)}
.cta-ic{position:absolute; inset-inline-end:var(--cta-pad); top:50%; width:var(--cta-c); height:var(--cta-c); margin-top:calc(var(--cta-c) / -2); display:grid; place-items:center; color:#FFFFFF; pointer-events:none}
.cta-ic svg{width:18px; height:18px; fill:none; stroke:currentColor; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; transition:transform 500ms var(--motion-ease)}
[dir="rtl"] .cta-ic svg{transform:scaleX(-1)}
.cta:hover .cta-ic svg,.cta:focus-visible .cta-ic svg{transform:rotate(-45deg)}
[dir="rtl"] .cta:hover .cta-ic svg,[dir="rtl"] .cta:focus-visible .cta-ic svg{transform:scaleX(-1) rotate(-45deg)}
.cta:active{transform:scale(.98)}

/* ===== 5. مبدّل المظهر .tt (مرجع Theme Toggle Button): يضبط html[data-theme] ويتذكر الاختيار ===== */
.tt{--tt-d:1; --tt-size:44px; --tt-ink:#F7F4FF; --tt-bg:rgba(35,30,59,.78); --tt-sun:#BBD2FF; --tt-moon:#C5B5F2;
  position:relative; display:inline-grid; place-items:center; width:var(--tt-size); height:var(--tt-size); padding:0; border:0; border-radius:50%; cursor:pointer; color:var(--tt-ink);
  background:var(--glass-sheen),var(--tt-bg); box-shadow:inset 0 0 0 1px var(--glass-border),var(--glass-edge); transition:transform 200ms var(--motion-ease); touch-action:manipulation; -webkit-tap-highlight-color:transparent}
[dir="rtl"] .tt{--tt-d:-1}
.xlib[data-xt="light"] .tt{--tt-ink:#231E3B; --tt-bg:rgba(255,255,255,.92); --tt-sun:#4A6FD9; --tt-moon:#354BD4; box-shadow:inset 0 0 0 1px rgba(35,30,59,.22)}
.tt:hover{transform:scale(1.08)} .tt:active{transform:scale(.94)}
.tt-i{position:absolute; inset:0; display:grid; place-items:center; transition:opacity 300ms var(--motion-ease),transform 400ms var(--motion-ease)}
.tt-i svg{width:55%; height:55%; fill:none; stroke:currentColor; stroke-width:1.9; stroke-linecap:round; stroke-linejoin:round}
.tt-sun{color:var(--tt-sun)} .tt-moon{color:var(--tt-moon)}
.tt[data-theme="dark"] .tt-sun,.tt.xlib[data-xt="light"] .tt-moon{opacity:0; transform:rotate(-70deg) scale(.5)}
.tt[data-theme="dark"] .tt-moon,.tt.xlib[data-xt="light"] .tt-sun{opacity:1; transform:none}
/* نوع المفتاح: data-type="switch". المقبض ::before والأيقونتان فوقه، وكلها تنزلق بالإزاحة وحدها */
.xlib[data-xt="light"] .tt[data-type="switch"]{--tt-bg:#CFC7E6}
.tt[data-type="switch"]{--tt-k:calc(var(--tt-size) * .72); --tt-x:calc(var(--tt-d) * var(--tt-size) * .86); width:calc(var(--tt-size) * 1.7); border-radius:var(--radius-pill)}
.tt[data-type="switch"]::before{content:""; position:absolute; top:50%; margin-top:calc(var(--tt-k) / -2); inset-inline-start:calc(var(--tt-size) * .14); width:var(--tt-k); height:var(--tt-k); border-radius:50%;
  background:#FFFFFF; box-shadow:0 1px 4px rgba(0,0,0,.28); transition:transform 320ms var(--motion-ease)}
.tt[data-type="switch"] .tt-i{inset:auto; top:50%; margin-top:calc(var(--tt-k) / -2); inset-inline-start:calc(var(--tt-size) * .14); width:var(--tt-k); height:var(--tt-k);
  transition:opacity 220ms linear,transform 320ms var(--motion-ease)}
.tt[data-type="switch"] .tt-i svg{width:62%; height:62%}
.tt[data-type="switch"] .tt-sun{--tt-sun:#4A6FD9} .tt[data-type="switch"] .tt-moon{--tt-moon:#354BD4}
.tt[data-type="switch"].xlib[data-xt="light"]::before,.tt[data-type="switch"].xlib[data-xt="light"] .tt-i{transform:translateX(var(--tt-x))}
.tt[data-type="switch"][data-theme="dark"] .tt-i,.tt[data-type="switch"].xlib[data-xt="light"] .tt-i{transform:translateX(0)}
.tt[data-type="switch"].xlib[data-xt="light"] .tt-i{transform:translateX(var(--tt-x))}
.tt[data-type="switch"][data-theme="dark"] .tt-sun,.tt[data-type="switch"].xlib[data-xt="light"] .tt-moon{opacity:0}
.tt[data-type="switch"][data-theme="dark"] .tt-moon,.tt[data-type="switch"].xlib[data-xt="light"] .tt-sun{opacity:1}

/* ===== الأوضاع وبدائلها ===== */
html[data-motion="simple"] .ngb-spin,html[data-motion="simple"] .lqg::before,html[data-motion="simple"] .lqg::after{animation:none!important}
html[data-motion="simple"] .ngb-shine{transition:opacity 200ms linear}

/* 1) طبقة التعديل */
#edm,#edb,#tour{position:fixed;z-index:90;display:none;border-radius:18px;padding:8px;-webkit-backdrop-filter:blur(22px) saturate(1.5);backdrop-filter:blur(22px) saturate(1.5);background-color:color-mix(in srgb,var(--bg) 78%,transparent)!important}
